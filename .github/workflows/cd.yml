name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy — Migrate DB + Render + Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    # Optional: Set up a "production" environment in GitHub Settings to require manual approvals
    environment: production 
    
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - name: Install Server Dependencies
        run: npm ci
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: 1. Apply Prisma migrations to Neon
        run: |
          npx prisma validate
          npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }} 

      # Native Render deployment (Requires RENDER_API_KEY and RENDER_SERVICE_ID)
      - name: 2. Deploy Backend to Render
        uses: JorgeLNJunior/render-deploy@v1.5.0
        with:
          service_id: ${{ secrets.RENDER_SERVICE_ID }}
          api_key: ${{ secrets.RENDER_API_KEY }}
          wait_deploy: true            # ✅ Correct input to wait for build completion
          github_token: ${{ secrets.GITHUB_TOKEN }}  # ✅ Required for GitHub Deployment tracking
        # Optional: If you don't want the GitHub Deployment to be created, you can remove
        # `github_token` and add `github_deployment: false` to the inputs.

      # Native Vercel deployment (Requires VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID)
      - name: 3. Deploy Frontend to Vercel
        working-directory: webapp # Change directory to Vercel project
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
